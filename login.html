<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>LaundraFlow • Manager Login</title>

    <link rel="stylesheet" href="../css/style.css">
</head>

<body class="login-page">

    <div class="login-container">

        <!-- LEFT SIDE -->
        <div class="login-visual">

            <div class="laundry-icon">
                👕
            </div>

            <h1>
                Laundra <span>Flow</span>
            </h1>

            <p>
                Smart Laundry Management
            </p>

            <div class="clothes">
                👕 👚 🧥 👖
            </div>

            <p class="visual-text">
                Manage customers, orders,
                tracking and billing with ease.
            </p>

        </div>


        <!-- RIGHT SIDE -->
        <div class="login-card">

            <div class="login-header">

                <h2>
                    Manager Login
                </h2>

                <p>
                    Welcome back! Please login to continue.
                </p>

            </div>


            <form id="loginForm">

                <div class="form-group">

                    <label for="email">
                        Email Address
                    </label>

                    <input
                        type="email"
                        id="email"
                        placeholder="Enter manager email"
                        required
                    >

                </div>


                <div class="form-group">

                    <label for="password">
                        Password
                    </label>

                    <input
                        type="password"
                        id="password"
                        placeholder="Enter password"
                        required
                    >

                </div>


                <button
                    type="submit"
                    class="login-button">

                    Login to Dashboard

                </button>


                <p
                    id="loginMessage"
                    class="login-message">
                </p>

            </form>

        </div>

    </div>


    <script src="../js/login.js"></script>

</body>

</html>
